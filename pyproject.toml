[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scradar"
version = "0.1.0"
description = "SBOM generation, OSV vulnerability matching, Nth-party dependency mapping and supplier concentration-risk scoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "jsonschema>=4.20",
    "referencing>=0.30",
    "types-requests",
]

[project.scripts]
scradar = "scradar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits the real OSV.dev network API",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
